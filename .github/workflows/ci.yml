name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  verify:
    name: Python ${{ matrix.python-version }} verification
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bootstrap isolated environment
        shell: powershell
        run: .\scripts\bootstrap.ps1 -Python python

      - name: Run formal verification
        shell: powershell
        run: .\scripts\verify.ps1

  pdf:
    name: Build and verify PDF (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt

      - name: Bootstrap isolated environment with PDF dependencies
        shell: powershell
        run: .\scripts\bootstrap.ps1 -Python python -WithDocs

      - name: Verify tracked PDF and its source digest
        shell: powershell
        run: |
          .\.venv\Scripts\python.exe .\scripts\verify_pdf.py
          .\.venv\Scripts\python.exe .\scripts\build_learning_guide_pdf.py --check-source

      - name: Build learning guide PDF
        shell: powershell
        run: .\.venv\Scripts\python.exe .\scripts\build_learning_guide_pdf.py

      - name: Verify learning guide PDF
        shell: powershell
        run: .\.venv\Scripts\python.exe .\scripts\verify_pdf.py

      - name: Upload learning guide PDF
        uses: actions/upload-artifact@v7
        with:
          name: LearnLLM-study-guide
          path: output/pdf/LearnLLM-从零学习大语言模型.pdf
          if-no-files-found: error
