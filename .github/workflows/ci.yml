name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  verify:
    name: Python ${{ matrix.python-version }} verification
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Bootstrap isolated environment
        shell: powershell
        run: .\scripts\bootstrap.ps1 -Python python

      - name: Run formal verification
        shell: powershell
        run: .\scripts\verify.ps1

  ubuntu-smoke:
    name: Ubuntu wheel install and quick smoke (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install runtime and build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build wheel without build isolation
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .

      - name: Install the built wheel non-editably
        run: python -m pip install --disable-pip-version-check dist/*.whl

      - name: Verify installed package metadata
        run: |
          expected_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          python -I -c "import importlib.metadata as metadata, pathlib, learn_llm; module_path = pathlib.Path(learn_llm.__file__).resolve(); assert metadata.version('learn-llm-from-zero') == '$expected_version'; assert 'site-packages' in module_path.parts, module_path; print('installed', metadata.version('learn-llm-from-zero'), module_path)"
          python -m pip check

      - name: Run installed-wheel functionality outside the repository
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import torch; from learn_llm.artifacts import
          TINY_GPT_CHECKPOINT_FORMAT_VERSION; from learn_llm.evaluation import
          EvaluationExample, evaluate_prediction; from learn_llm.experiment_tracking
          import RUN_MANIFEST_VERSION; from learn_llm.model import TinyGPT,
          TinyGPTConfig; from learn_llm.sft_pipeline import attention_lora_targets;
          example=EvaluationExample.from_mapping({'id':'smoke','split':'test',
          'intent_family':'smoke','evaluation_category':'new_intent',
          'instruction':'A','response':'B','required_keywords':['B'],
          'format_requirements':{'must_end_with':None,'max_sentences':1,
          'forbidden_substrings':[]}}); assert evaluate_prediction(example,'B').task_success
          == 1.0; model=TinyGPT(TinyGPTConfig(vocab_size=4,block_size=4,
          n_layer=1,n_head=1,n_embd=4)); logits,_=model(torch.tensor([[0,1]]));
          assert logits.shape == (1,2,4); assert attention_lora_targets(model.config);
          assert TINY_GPT_CHECKPOINT_FORMAT_VERSION == RUN_MANIFEST_VERSION == 1"

      - name: Run Ubuntu unit tests and quick training chain
        run: |
          python -m unittest discover -s tests -v
          python experiments/06_train_tiny_gpt.py --quick
          python experiments/10_sft_tiny_gpt.py --quick
          python experiments/07_generate.py --base-checkpoint checkpoints/tiny_gpt.pt --adapter checkpoints/tiny_gpt_lora_adapter.pt --prompt "为什么需要因果掩码？" --tokens 8

      - name: Upload SFT comparison manifest
        uses: actions/upload-artifact@v7
        with:
          name: LearnLLM-sft-comparison
          path: |
            outputs/sft/**/sft_comparison.json
            outputs/sft/**/sft_comparison.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: LearnLLM-python-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  pdf:
    name: Build and verify PDF (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-docs.txt

      - name: Bootstrap isolated environment with PDF dependencies
        shell: powershell
        run: .\scripts\bootstrap.ps1 -Python python -WithDocs

      - name: Verify tracked PDF and its source digest
        shell: powershell
        run: |
          .\.venv\Scripts\python.exe .\scripts\verify_pdf.py
          .\.venv\Scripts\python.exe .\scripts\build_learning_guide_pdf.py --check-source

      - name: Build learning guide PDF
        shell: powershell
        run: .\.venv\Scripts\python.exe .\scripts\build_learning_guide_pdf.py

      - name: Verify learning guide PDF
        shell: powershell
        run: .\.venv\Scripts\python.exe .\scripts\verify_pdf.py

      - name: Upload learning guide PDF
        uses: actions/upload-artifact@v7
        with:
          name: LearnLLM-study-guide
          path: output/pdf/LearnLLM-从零学习大语言模型.pdf
          if-no-files-found: error
