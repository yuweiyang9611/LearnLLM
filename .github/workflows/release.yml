name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    name: Verify Ubuntu wheel candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install runtime and build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build and install wheel
        run: |
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
          python -m pip install --disable-pip-version-check dist/*.whl
          python -m pip check

      - name: Run installed-wheel functionality outside the repository
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import torch; from learn_llm.artifacts import
          TINY_GPT_CHECKPOINT_FORMAT_VERSION; from learn_llm.evaluation import
          EvaluationExample, evaluate_prediction; from learn_llm.experiment_tracking
          import RUN_MANIFEST_VERSION; from learn_llm.model import TinyGPT,
          TinyGPTConfig; from learn_llm.sft_pipeline import attention_lora_targets;
          example=EvaluationExample.from_mapping({'id':'smoke','split':'test',
          'intent_family':'smoke','evaluation_category':'new_intent',
          'instruction':'A','response':'B','required_keywords':['B'],
          'format_requirements':{'must_end_with':None,'max_sentences':1,
          'forbidden_substrings':[]}}); assert evaluate_prediction(example,'B').task_success
          == 1.0; model=TinyGPT(TinyGPTConfig(vocab_size=4,block_size=4,
          n_layer=1,n_head=1,n_embd=4)); logits,_=model(torch.tensor([[0,1]]));
          assert logits.shape == (1,2,4); assert attention_lora_targets(model.config);
          assert TINY_GPT_CHECKPOINT_FORMAT_VERSION == RUN_MANIFEST_VERSION == 1"

      - name: Run Ubuntu tests and artifact reload chain
        run: |
          python -m unittest discover -s tests -v
          python experiments/06_train_tiny_gpt.py --quick
          python experiments/10_sft_tiny_gpt.py --quick
          python experiments/07_generate.py --base-checkpoint checkpoints/tiny_gpt.pt --adapter checkpoints/tiny_gpt_lora_adapter.pt --prompt "为什么需要因果掩码？" --tokens 8

  build:
    name: Verify tag and build release candidates
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      notes_path: ${{ steps.metadata.outputs.notes_path }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-docs.txt

      - name: Validate tag, package version, changelog, and release notes
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, got: $tag"
          }

          $tagVersion = $Matches.version
          $projectVersion = (& python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read project.version from pyproject.toml."
          }
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version $tagVersion does not match pyproject.toml version $projectVersion."
          }

          $changelog = Get-Content -LiteralPath "CHANGELOG.md" -Raw -Encoding utf8
          $escapedVersion = [regex]::Escape($projectVersion)
          if ($changelog -notmatch "(?m)^## \[$escapedVersion\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$") {
            throw "CHANGELOG.md has no dated section for version $projectVersion."
          }

          $notesPath = "docs/RELEASE_$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes do not exist: $notesPath"
          }

          "version=$projectVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Validated release $tag from $notesPath."

      - name: Bootstrap environment with PDF dependencies
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -Python python -WithDocs

      - name: Run full verification
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Verify tracked PDF and its source digest
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe .\scripts\verify_pdf.py
          .\.venv\Scripts\python.exe .\scripts\build_learning_guide_pdf.py --check-source

      - name: Rebuild and verify release PDF
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe .\scripts\build_learning_guide_pdf.py
          .\.venv\Scripts\python.exe .\scripts\verify_pdf.py

      - name: Prepare versioned assets and SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.metadata.outputs.version }}"
          $releaseDirectory = Join-Path $PWD "release"
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null

          $sourcePdf = "output/pdf/LearnLLM-从零学习大语言模型.pdf"
          $pdfName = "LearnLLM-v$version-Chinese-Study-Guide.pdf"
          $pdfAsset = Join-Path $releaseDirectory $pdfName
          Copy-Item -LiteralPath $sourcePdf -Destination $pdfAsset

          $checksumName = "LearnLLM-v$version-SHA256SUMS.txt"
          $checksumAsset = Join-Path $releaseDirectory $checksumName
          $digest = (Get-FileHash -LiteralPath $pdfAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = "$digest  $pdfName$([Environment]::NewLine)"
          [IO.File]::WriteAllText($checksumAsset, $checksumLine, [Text.UTF8Encoding]::new($false))

          Write-Host "PDF SHA256: $digest"

      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: LearnLLM-${{ github.ref_name }}-release-candidates
          path: release/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: [build, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified release candidates
        uses: actions/download-artifact@v8
        with:
          name: LearnLLM-${{ github.ref_name }}-release-candidates
          path: release

      - name: Create GitHub Release from the existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${{ needs.build.outputs.version }}"
          notes_path="${{ needs.build.outputs.notes_path }}"
          pdf_asset="release/LearnLLM-v${version}-Chinese-Study-Guide.pdf"
          checksum_asset="release/LearnLLM-v${version}-SHA256SUMS.txt"

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "LearnLLM $tag" \
            --notes-file "$notes_path" \
            "$pdf_asset#LearnLLM $tag 中文学习指导 PDF" \
            "$checksum_asset#SHA-256 checksums"
