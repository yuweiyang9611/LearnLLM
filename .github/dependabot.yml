version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 6
    groups:
      python-runtime:
        patterns:
          - numpy
          - setuptools
          - torch
      documentation:
        patterns:
          - mkdocs-material
          - pypdf
          - reportlab

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 4
    groups:
      github-actions:
        patterns:
          - "*"
