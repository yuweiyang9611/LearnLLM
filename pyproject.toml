[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-llm-from-zero"
version = "0.3.0"
description = "从零理解并动手实现 LLM 的中文学习实验"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE-CODE"]
dependencies = [
    "numpy==2.4.6",
    # The wheel metadata must use the public version. requirements.txt keeps
    # the CPU-only index and +cpu build for the course environment.
    "torch==2.14.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
docs = [
    "reportlab==5.0.1",
    "pypdf==6.18.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
